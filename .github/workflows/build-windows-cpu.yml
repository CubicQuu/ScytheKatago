name: Build ScytheKataGo Windows CPU

on:
  push:
    branches:
      - codex/windows-cpu-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-cpu:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout Scythe patches
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Checkout matching KataGo source
        uses: actions/checkout@v4
        with:
          repository: lightvector/KataGo
          ref: 4f78e16742c25ff7c78156a1aef9f1d00df6d5b0
          path: katago

      - name: Checkout LizzieYzy
        uses: actions/checkout@v4
        with:
          repository: yzyray/lizzieyzy
          ref: main
          path: lizzieyzy

      - name: Apply Scythe patches
        shell: pwsh
        run: |
          Copy-Item -Force patches/KataGo/cpp/command/gtp.cpp katago/cpp/command/gtp.cpp
          Copy-Item -Force patches/KataGo/cpp/game/boardhistory.cpp katago/cpp/game/boardhistory.cpp
          Copy-Item -Force patches/KataGo/cpp/game/boardhistory.h katago/cpp/game/boardhistory.h
          Copy-Item -Force patches/KataGo/cpp/search/search.cpp katago/cpp/search/search.cpp
          Copy-Item -Force patches/lizzieyzy-main/src/main/java/featurecat/lizzie/Config.java lizzieyzy/src/main/java/featurecat/lizzie/Config.java
          Copy-Item -Force patches/lizzieyzy-main/src/main/java/featurecat/lizzie/gui/ScythePanel.java lizzieyzy/src/main/java/featurecat/lizzie/gui/ScythePanel.java
          Copy-Item -Force patches/lizzieyzy-main/src/main/java/featurecat/lizzie/rules/Board.java lizzieyzy/src/main/java/featurecat/lizzie/rules/Board.java
          Copy-Item -Force patches/lizzieyzy-main/src/main/java/featurecat/lizzie/rules/BoardHistoryNode.java lizzieyzy/src/main/java/featurecat/lizzie/rules/BoardHistoryNode.java

          # The patch-only repository omitted these AsyncBot declarations and wrappers.
          $hPath = "katago/cpp/search/asyncbot.h"
          $h = Get-Content -Raw $hPath
          $hNeedle = "  void setPosition(Player pla, const Board& board, const BoardHistory& history);"
          if (-not $h.Contains($hNeedle)) { throw "AsyncBot header insertion point not found" }
          $hInsert = @"
          $hNeedle
            void setManualScytheTrigger(bool trigger);
            void setScytheCount(Player pla, int count);
            void setScytheState(int blackCount, int whiteCount, int combo, bool manualTrigger);
          "@
          $h.Replace($hNeedle, $hInsert.TrimEnd()) | Set-Content -NoNewline -Encoding UTF8 $hPath

          $cppPath = "katago/cpp/search/asyncbot.cpp"
          $cpp = Get-Content -Raw $cppPath
          $cppNeedle = "void AsyncBot::setPosition(Player pla, const Board& board, const BoardHistory& history) {"
          if (-not $cpp.Contains($cppNeedle)) { throw "AsyncBot source insertion point not found" }
          $cppInsert = @"
          void AsyncBot::setManualScytheTrigger(bool trigger) {
            stopAndWait();
            search->rootHistory.manualScytheTrigger = trigger;
          }
          void AsyncBot::setScytheCount(Player pla, int count) {
            stopAndWait();
            if(pla == P_BLACK)
              search->rootHistory.blackScythes = count;
            else if(pla == P_WHITE)
              search->rootHistory.whiteScythes = count;
          }
          void AsyncBot::setScytheState(int blackCount, int whiteCount, int combo, bool manualTrigger) {
            stopAndWait();
            search->rootHistory.blackScythes = blackCount;
            search->rootHistory.whiteScythes = whiteCount;
            search->rootHistory.scytheCombo = combo;
            search->rootHistory.manualScytheTrigger = manualTrigger;
          }

          $cppNeedle
          "@
          $cpp.Replace($cppNeedle, $cppInsert.TrimEnd()) | Set-Content -NoNewline -Encoding UTF8 $cppPath

          # Restore the omitted LizzieFrame integration so the panel is visible and usable.
          $framePath = "lizzieyzy/src/main/java/featurecat/lizzie/gui/LizzieFrame.java"
          $frame = Get-Content -Raw $framePath

          $fieldNeedle = "  public static BottomToolbar toolbar;"
          if (-not $frame.Contains($fieldNeedle)) { throw "LizzieFrame field insertion point not found" }
          $frame = $frame.Replace(
            $fieldNeedle,
            "$fieldNeedle`r`n  public static ScythePanel scythePanel;"
          )

          $ctorNeedle = "    topPanel = new JToolBar();"
          if (-not $frame.Contains($ctorNeedle)) { throw "LizzieFrame constructor insertion point not found" }
          $frame = $frame.Replace(
            $ctorNeedle,
            "$ctorNeedle`r`n    scythePanel = new ScythePanel();"
          )

          $baseNeedle = "    basePanel.setLayout(null);"
          if (-not $frame.Contains($baseNeedle)) { throw "LizzieFrame base panel insertion point not found" }
          $frame = $frame.Replace(
            $baseNeedle,
            "$baseNeedle`r`n    scythePanel.setBounds(Math.max(0, getWidth() - 220), 0, 200, 40);`r`n    basePanel.add(scythePanel, new Integer(11));"
          )

          $resizeNeedle = "            int width = getWidth() - getInsets().left - getInsets().right;"
          if (-not $frame.Contains($resizeNeedle)) { throw "LizzieFrame resize insertion point not found" }
          $frame = $frame.Replace(
            $resizeNeedle,
            "$resizeNeedle`r`n            scythePanel.setBounds(Math.max(0, width - 220), 0, 200, 40);"
          )

          $frame | Set-Content -NoNewline -Encoding UTF8 $framePath

      - name: Download smoke-test network
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sanderland/katrain/releases/download/v1.14.0/KaTrain.zip" -OutFile "katrain.zip"
          Expand-Archive -Path "katrain.zip" -DestinationPath "katrain-model"
          $network = Get-ChildItem "katrain-model" -Recurse -Filter "*.bin.gz" | Select-Object -First 1
          if (-not $network) { throw "KaTrain package did not contain a KataGo network" }
          Copy-Item $network.FullName "smoke-model.bin.gz"
          Write-Host "Using network $($network.Name)"

      - name: Install C++ dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows eigen3:x64-windows

      - name: Configure KataGo CPU build
        shell: pwsh
        run: |
          cmake -S katago/cpp -B katago/cpp/build -A x64 `
            -DUSE_BACKEND=EIGEN `
            -DEIGEN3_INCLUDE_DIRS="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include/eigen3" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Compile KataGo
        shell: pwsh
        run: cmake --build katago/cpp/build --config Release --parallel 4

      - name: Test KataGo executable
        shell: pwsh
        run: katago/cpp/build/Release/katago.exe version

      - name: Smoke-test live GTP analysis
        shell: pwsh
        run: |
          $exe = (Resolve-Path "katago/cpp/build/Release/katago.exe").Path
          $model = (Resolve-Path "smoke-model.bin.gz").Path
          $config = (Resolve-Path "katago/cpp/configs/gtp_example.cfg").Path

          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $exe
          $psi.Arguments = "gtp -model `"$model`" -config `"$config`""
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true

          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $psi
          if (-not $process.Start()) { throw "Failed to start KataGo" }
          $stdoutTask = $process.StandardOutput.ReadToEndAsync()
          $stderrTask = $process.StandardError.ReadToEndAsync()

          $process.StandardInput.WriteLine("name")
          $process.StandardInput.WriteLine("boardsize 11")
          $process.StandardInput.WriteLine("clear_board")
          $process.StandardInput.WriteLine("komi 7.5")
          $process.StandardInput.WriteLine("lz-analyze 10")
          $process.StandardInput.Flush()
          Start-Sleep -Seconds 8

          if ($process.HasExited) {
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            Write-Host "--- stdout ---"
            Write-Host $stdout
            Write-Host "--- stderr ---"
            Write-Host $stderr
            throw "KataGo exited during lz-analyze with code $($process.ExitCode)"
          }

          $process.StandardInput.WriteLine("stop")
          $process.StandardInput.WriteLine("quit")
          $process.StandardInput.Close()
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "KataGo did not exit after quit"
          }

          $stdout = $stdoutTask.GetAwaiter().GetResult()
          $stderr = $stderrTask.GetAwaiter().GetResult()
          Write-Host "--- stdout ---"
          Write-Host $stdout
          Write-Host "--- stderr ---"
          Write-Host $stderr
          if ($process.ExitCode -ne 0) { throw "KataGo exited with code $($process.ExitCode)" }
          if ($stdout -notmatch "info move") { throw "No live analysis output was produced" }

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Compile LizzieYzy GUI
        working-directory: lizzieyzy
        shell: pwsh
        run: mvn -B -DskipTests package

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/engine | Out-Null
          New-Item -ItemType Directory -Force dist/gui | Out-Null
          Copy-Item katago/cpp/build/Release/katago.exe dist/engine/katago.exe
          Get-ChildItem katago/cpp/build/Release -Filter "*.dll" | Copy-Item -Destination dist/engine
          Copy-Item smoke-model.bin.gz dist/engine/model.bin.gz
          if (Test-Path katago/cpp/configs) { Copy-Item -Recurse katago/cpp/configs dist/engine/configs }
          $jar = Get-ChildItem lizzieyzy/target -Filter "*shaded.jar" | Select-Object -First 1
          if (-not $jar) { throw "LizzieYzy shaded JAR was not produced" }
          Copy-Item $jar.FullName dist/gui/lizzie-yzy2.5.3-shaded.jar
          @"
          @echo off
          cd /d "%~dp0gui"
          java -jar lizzie-yzy2.5.3-shaded.jar
          if errorlevel 1 pause
          "@ | Set-Content -Encoding ASCII dist/Start-ScytheKataGo.bat
          @"
          ScytheKataGo Windows CPU ready-to-run build

          已包含並通過 11x11 lz-analyze 實際測試：
          - engine/katago.exe
          - engine/model.bin.gz
          - engine/configs/gtp_example.cfg
          - gui/lizzie-yzy2.5.3-shaded.jar
          - Start-ScytheKataGo.bat

          LizzieYzy 引擎命令：
          "%~dp0engine\katago.exe" gtp -model "%~dp0engine\model.bin.gz" -config "%~dp0engine\configs\gtp_example.cfg"

          模型來源：
          KaTrain v1.14.0 所附 kata1-b18c384nbt-s6582191360-d3422816034.bin.gz
          https://github.com/sanderland/katrain/releases/tag/v1.14.0
          官方神經網路授權：https://katagotraining.org/

          注意：本程式未簽章，僅由公開原始碼自動編譯。
          "@ | Set-Content -Encoding UTF8 dist/README.txt

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ScytheKataGo-Windows-CPU-Ready
          path: dist
          if-no-files-found: error
          retention-days: 14
